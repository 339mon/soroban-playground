[package]
name = "zk-verifier"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Groth16 verifier over BN254 for Soroban"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "26.1.0"

[dev-dependencies]
ark-bn254 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
soroban-sdk = { version = "26.1.0", features = ["testutils"] }

